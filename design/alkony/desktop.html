<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightjar Alkony: desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* page chrome (not part of the design) */
*{box-sizing:border-box}
body{margin:0;background:#08070f;color:#e9e6f5;font:16px/1.5 system-ui,sans-serif;padding:24px 24px 64px}
.top{max-width:1440px;margin:0 auto 24px}
.top h1{font:600 26px/1.2 system-ui;margin:0 0 6px}
.top p{margin:0;color:#b9b5d0;max-width:80ch}
.group{max-width:1440px;margin:0 auto 40px}
.group>h2{font:600 16px system-ui;color:#b9b5d0;margin:0 0 12px}
figure{margin:0 0 28px}
figcaption{font:13px system-ui;color:#b9b5d0;margin-top:8px}

/* ---------- design tokens (same as mobile): dark default ---------- */
.app{
  --bg:#14122b; --bg2:#1c1940; --surface:#1e1b3d; --surface2:#2b2754; --line:#3a3568;
  --text:#f0ecfa; --muted:#b4aed3; --accent:#f6b45c; --on-accent:#2a1a05; --accent-text:#f6b45c;
  --glow:#4a3a8c; --danger:#ff8a8a;
  width:100%;height:900px;border-radius:20px;overflow:hidden;position:relative;
  background:var(--bg);color:var(--text);font:400 16px/1.5 'Figtree',system-ui,sans-serif;
  display:grid;grid-template-columns:232px minmax(0,1fr);box-shadow:0 0 0 1px #ffffff1f,0 24px 60px #0008;
}
.app.light{
  --bg:#f7f2fb; --bg2:#ebe3f6; --surface:#ffffff; --surface2:#efe8f8; --line:#d6cbe8;
  --text:#231f45; --muted:#585280; --accent:#f0a93f; --on-accent:#2a1a05; --accent-text:#8a4a00;
  --glow:#ffd9a0; --danger:#b3261e;
}
@media (max-width:1360px){.app{height:800px}}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 60% at 60% 0%,var(--bg2) 0%,transparent 100%),
             radial-gradient(50% 45% at 60% 100%,var(--glow) 0%,transparent 100%);opacity:.6}
.app>*{position:relative;min-height:0}
button{font:inherit;color:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* sidebar */
.side{background:var(--surface);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font:600 22px 'Fraunces',serif;padding:0 10px 22px}
.brand svg{width:30px;height:30px;color:var(--accent-text)}
.nav{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:24px;color:var(--muted);text-decoration:none;font-weight:500}
.nav[aria-current]{background:var(--surface2);color:var(--text);font-weight:700}
.nav[aria-current] svg{color:var(--accent-text)}
.side .grow{flex:1}
.newrec{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:26px;border:0;background:var(--accent);color:var(--on-accent);font-weight:700;margin-bottom:10px}
.privacy{font-size:13px;color:var(--muted);padding:0 10px;margin:0}

/* main areas */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.date{font:italic 400 17px 'Fraunces',serif;color:var(--muted)}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);height:100%}
.home .hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 40px;text-align:center}
.greet{font:400 44px/1.15 'Fraunces',serif;margin:6px 0 0;max-width:16ch;text-wrap:balance}
.rec{width:176px;height:176px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:48px 0 0;
  box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 22%,transparent),0 0 0 30px color-mix(in srgb,var(--accent) 10%,transparent),0 14px 40px color-mix(in srgb,var(--accent) 30%,transparent)}
.rec svg{width:68px;height:68px;stroke-width:1.8}
.rec-label{margin:44px 0 22px;font-weight:600;font-size:18px}
.write{min-width:240px;min-height:52px;padding:0 28px;border-radius:26px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600}
.today{border-left:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:32px 28px;overflow:hidden}
.sec{font:600 20px 'Fraunces',serif;margin:0 0 14px}
.card{background:var(--surface);border-radius:22px;padding:14px 18px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.card .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:4px}
.card .meta svg{width:16px;height:16px}
.card p{margin:0;font:400 16px/1.5 'Fraunces',serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Recorder */
.rec-main{align-items:center;justify-content:center;padding:32px 40px}
.state{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:20px;background:var(--surface);font-weight:600;font-size:14px}
.state b{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.timer{font:300 128px/1 'Fraunces',serif;font-variant-numeric:tabular-nums;margin:36px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.meter{display:flex;align-items:center;justify-content:center;gap:5px;height:120px;margin:40px 0 0;width:min(640px,100%)}
.meter span{width:6px;border-radius:3px;background:var(--accent);flex:none}
.meter span.old{opacity:.4}
.ctrls{display:flex;gap:56px;align-items:flex-start;margin-top:40px}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;font-weight:600;font-size:14px;min-width:84px;padding:0}
.ctrl .c{width:64px;height:64px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.ctrl.stop .c{width:96px;height:96px;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 20%,transparent)}
.ctrl.stop svg{width:36px;height:36px;fill:currentColor}
.ctrl.del{color:var(--danger)}

/* Entry: timeline + reading pane */
.split{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);height:100%}
.list{border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);padding:24px 16px;overflow:hidden}
.list h2.day{font:600 15px 'Figtree',sans-serif;color:var(--muted);margin:14px 10px 8px}
.list h2.day:first-child{margin-top:0}
.row{display:block;border-radius:18px;padding:10px 14px;margin-bottom:6px;color:inherit;text-decoration:none}
.row[aria-current]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.row .meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:2px}
.row .meta svg{width:16px;height:16px}
.row p{margin:0;font:400 15px/1.45 'Fraunces',serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.read{padding:28px 56px;overflow:hidden}
.read-in{max-width:720px}
.entry-date{font:600 32px/1.2 'Fraunces',serif;margin:0 0 12px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.body-text{font:400 19px/1.65 'Fraunces',serif;margin:18px 0 0}
.lab{font-weight:700;font-size:15px;margin:20px 0 10px;color:var(--muted)}
.rcard{background:var(--surface);border-radius:22px;padding:16px 20px;margin-bottom:12px}
.player{display:flex;align-items:center;gap:14px}
.pl{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.pl svg{width:20px;height:20px;fill:currentColor;stroke:none}
.track{flex:1;height:6px;border-radius:3px;background:var(--surface2);position:relative}
.track i{position:absolute;inset:0 auto 0 0;width:42%;background:var(--accent);border-radius:3px}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tr{font:400 17px/1.6 'Fraunces',serif;margin:12px 0 0}
.tag{font-size:13px;color:var(--muted);display:flex;gap:8px;margin-top:8px}
.working{display:flex;align-items:center;gap:8px;margin:12px 0 8px;font-weight:600;font-size:15px;color:var(--accent-text)}
.sk{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sh 2s linear infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}
.add{min-height:48px;padding:0 24px;border-radius:24px;border:1.5px dashed var(--line);background:none;font-weight:600;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
@media (prefers-reduced-motion:reduce){.state b,.sk{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></symbol>
    <symbol id="list" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></symbol>
    <symbol id="bird" viewBox="0 0 24 24"><path d="M3 15c4 1 8-1 10-5 1-2 3-3 6-2-1 1-1 2-1 3 0 5-4 9-9 9-3 0-5-2-6-5z" fill="currentColor" stroke="none"/><circle cx="17" cy="10" r="1" fill="#14122b" stroke="none"/></symbol>
  </defs>
</svg>

<div class="top">
  <h1>Alkony: desktop</h1>
  <p>Same tokens as the mobile mockup. The tab bar becomes a left sidebar, Home puts today's entries beside the record button, and the entry screen shows the timeline next to the reading pane. Frames are 1440x900 (800 high below 1360 wide).</p>
</div>

<div class="group" id="g-dark"><h2>Sötét téma (dark)</h2></div>
<div class="group" id="g-light"><h2>Világos téma (light)</h2></div>

<script>
const side=(cur,showRec)=>`
<nav class="side" aria-label="Fő navigáció">
  <div class="brand"><svg class="i"><use href="#bird"/></svg>Nightjar</div>
  <a class="nav" href="#" ${cur==='ma'?'aria-current="page"':''}><svg class="i"><use href="#home"/></svg>Ma</a>
  <a class="nav" href="#" ${cur==='ido'?'aria-current="page"':''}><svg class="i"><use href="#list"/></svg>Idővonal</a>
  <a class="nav" href="#"><svg class="i"><use href="#search"/></svg>Keresés</a>
  <a class="nav" href="#"><svg class="i"><use href="#gear"/></svg>Beállítások</a>
  <div class="grow"></div>
  ${showRec?`<button class="newrec"><svg class="i"><use href="#mic"/></svg>Felvétel indítása</button>`:''}
  <p class="privacy">A hang a saját szervereden marad.</p>
</nav>`;

const home=`
<div class="home">
  <section class="hero">
    <div class="date">csütörtök, november 26.</div>
    <h1 class="greet">Jó estét. Mi járt a fejedben?</h1>
    <button class="rec" aria-label="Felvétel indítása"><svg class="i"><use href="#mic"/></svg></button>
    <div class="rec-label">Felvétel indítása</div>
    <button class="write"><svg class="i"><use href="#pen"/></svg>Inkább írok</button>
  </section>
  <section class="today" aria-label="Mai bejegyzések">
    <h2 class="sec">Mai bejegyzések</h2>
    <div class="card"><div class="meta"><svg class="i"><use href="#mic"/></svg>20:42 · 1:48</div><p>Séta a Duna-parton munka után. Végre nem sietett senki, csak a víz meg én.</p></div>
    <div class="card"><div class="meta"><svg class="i"><use href="#pen"/></svg>13:05</div><p>Ebéd Annával. Mesélt az új lakásról, és kicsit irigy lettem.</p></div>
  </section>
</div>`;

const recorder=`
<div class="main rec-main" style="height:100%;align-items:center;justify-content:center">
  <span class="state"><b></b>Felvétel folyamatban</span>
  <div class="timer" role="timer" aria-label="Eltelt idő">02:14</div>
  <p class="sub">Beszélj nyugodtan, nem sietünk.</p>
  <div class="meter" data-meter aria-hidden="true"></div>
  <div class="ctrls">
    <button class="ctrl del"><span class="c"><svg class="i"><use href="#trash"/></svg></span>Elvetés</button>
    <button class="ctrl stop"><span class="c"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></span>Leállítás</button>
    <button class="ctrl"><span class="c"><svg class="i"><use href="#pause"/></svg></span>Szünet</button>
  </div>
</div>`;

const play=`<button class="pl" aria-label="Lejátszás"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg></button>`;
const entry=`
<div class="split">
  <section class="list" aria-label="Idővonal">
    <h2 class="day">Ma, november 26.</h2>
    <a class="row" href="#" aria-current="true"><div class="meta"><svg class="i"><use href="#mic"/></svg>20:42 · 1:48</div><p>Hosszú nap, de jó értelemben. Délelőtt a megbeszélés jobban sikerült, mint vártam.</p></a>
    <a class="row" href="#"><div class="meta"><svg class="i"><use href="#pen"/></svg>13:05</div><p>Ebéd Annával. Mesélt az új lakásról, és kicsit irigy lettem.</p></a>
    <h2 class="day">Tegnap, november 25.</h2>
    <a class="row" href="#"><div class="meta"><svg class="i"><use href="#mic"/></svg>22:10 · 0:52</div><p>Későn értem haza, de jólesett a csend a lépcsőházban.</p></a>
    <h2 class="day">November 23., hétfő</h2>
    <a class="row" href="#"><div class="meta"><svg class="i"><use href="#pen"/></svg>18:30</div><p>Elkezdtem pakolni a könyveket, többet találtam, mint gondoltam.</p></a>
    <a class="row" href="#"><div class="meta"><svg class="i"><use href="#mic"/></svg>08:05 · 2:31</div><p>Reggeli gondolatok a költözésről, még nem mondtam el senkinek.</p></a>
  </section>
  <article class="read"><div class="read-in">
    <h1 class="entry-date">2026. november 26., csütörtök</h1>
    <button class="chip"><svg class="i" style="width:18px;height:18px"><use href="#cal"/></svg>Dátum módosítása</button>
    <p class="body-text">Hosszú nap, de jó értelemben. Délelőtt a megbeszélés jobban sikerült, mint vártam, délután pedig kiszaladtam a partra.</p>
    <div class="lab">Hangfelvételek</div>
    <div class="rcard">
      <div class="player">${play}<div class="track"><i></i></div><span class="time">0:46 / 1:48</span></div>
      <p class="tr">Ma reggel korán keltem, és megint eszembe jutott a költözés. Szerintem készen állok rá, csak még el kell mondanom a szüleimnek.</p>
      <div class="tag"><span>Magyar</span><span>20:42</span></div>
    </div>
    <div class="rcard">
      <div class="player">${play}<div class="track"><i style="width:0"></i></div><span class="time">0:00 / 0:36</span></div>
      <div class="working"><svg class="i" style="width:18px;height:18px"><use href="#bird"/></svg>Átírás folyamatban…</div>
      <div class="sk" style="width:100%"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:55%"></div>
    </div>
    <button class="add"><svg class="i"><use href="#mic"/></svg>Újabb felvétel</button>
  </div></article>
</div>`;

const screens=[
  ['1. Ma (Home)',side('ma',false)+`<main class="main">${home}</main>`,'ma'],
  ['2. Felvétel (Recorder)',side('',false)+`<main class="main">${recorder}</main>`,'felvetel'],
  ['3. Bejegyzés (Entry: idővonal + olvasó)',side('ido',true)+`<main class="main">${entry}</main>`,'bejegyzes'],
];
for(const [theme,id] of [['dark','g-dark'],['light','g-light']]){
  const g=document.getElementById(id);
  for(const [cap,html,key] of screens){
    const f=document.createElement('figure');
    f.innerHTML=`<section class="app ${theme==='light'?'light':''}" id="${key}-${theme}" aria-label="${cap}">${html}</section><figcaption>${cap}</figcaption>`;
    g.appendChild(f);
  }
}
// mockup only: fake level meter bars
document.querySelectorAll('[data-meter]').forEach(m=>{
  for(let i=0;i<64;i++){
    const s=document.createElement('span');
    const h=14+Math.abs(Math.sin(i*.55)*Math.cos(i*.21))*92;
    s.style.height=h+'px'; if(i>48)s.className='old'; m.appendChild(s);
  }
});
</script>
</body>
</html>
