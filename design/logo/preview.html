<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightjar logo</title>
<style>
  body { margin: 0; font: 12px system-ui, sans-serif; display: grid; grid-template-columns: auto auto; width: max-content; }
  .panel { display: flex; align-items: flex-end; gap: 28px; padding: 24px; }
  .dark { background: #14122b; color: #f0ecfa; }
  .light { background: #f7f2fb; color: #231f45; }
  figure { margin: 0; text-align: center; }
  img { display: block; margin-bottom: 6px; }
</style>
</head>
<body>
  <div class="panel dark">
    <figure><img src="nightjar.svg" width="512" height="512" alt="">512</figure>
    <figure><img src="nightjar.svg" width="128" height="128" alt="">128</figure>
    <figure><img src="nightjar.svg" width="32" height="32" alt="">32</figure>
  </div>
  <div class="panel light">
    <figure><img src="nightjar.svg" width="512" height="512" alt="">512</figure>
    <figure><img src="nightjar.svg" width="128" height="128" alt="">128</figure>
    <figure><img src="nightjar.svg" width="32" height="32" alt="">32</figure>
  </div>
</body>
</html>
