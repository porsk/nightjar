<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightjar social preview</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; box-sizing: border-box; padding: 0 90px;
    display: flex; align-items: center; gap: 70px; overflow: hidden;
    font-family: system-ui, "Segoe UI", sans-serif; color: #f0ecfa;
    background:
      radial-gradient(ellipse 700px 420px at 18% 55%, rgba(246, 180, 92, 0.28), transparent 70%),
      linear-gradient(180deg, #14122b, #2b2754);
  }
  img { width: 300px; height: 300px; flex: none; }
  h1 { margin: 0 0 24px; font-size: 128px; line-height: 1; font-weight: 700; letter-spacing: -2px; color: #f6b45c; }
  p { margin: 0; font-size: 40px; line-height: 1.3; max-width: 700px; }
</style>
</head>
<body>
  <img src="nightjar.svg" alt="">
  <div>
    <h1>Nightjar</h1>
    <p>Self-hosted voice journal. Speak or type, transcribed offline on your own server.</p>
  </div>
</body>
</html>
