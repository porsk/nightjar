name: Setup
description: Install pnpm, Node and the locked dependencies (pnpm store cached)

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
