name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title must be a conventional commit, like 'feat: add recorder'"
            exit 1
          fi

  # code: anything except docs, design and .claude (every job runs)
  # tested_docs: docs that unit tests and the AC check read (only the checks job runs)
  # readme: README.md changed (Docker Hub description)
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tested_docs: ${{ steps.diff.outputs.tested_docs }}
      readme: ${{ steps.diff.outputs.readme }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          code=false tested_docs=false readme=false
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            code=true
          else
            while IFS= read -r file; do
              case "$file" in
                README.md) tested_docs=true readme=true ;;
                docs/specs/* | docs/backup.md | docs/engineering.md) tested_docs=true ;;
                docs/* | design/* | .claude/* | *.md) ;;
                *) code=true ;;
              esac
            done < <(git diff --name-only "$BASE" "$HEAD")
          fi
          printf 'code=%s\ntested_docs=%s\nreadme=%s\n' "$code" "$tested_docs" "$readme" | tee -a "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.tested_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:acs

  api:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg)
      - run: pnpm test:api

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e-chromium, project: chromium, browser: chromium }
          - { name: e2e-webkit, project: webkit-mobile, browser: webkit }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg)
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: ${{ matrix.name }}-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  image:
    needs: [changes, checks, api, e2e]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: porsk/nightjar:edge
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max

  upgrade:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: nightjar-upgrade:test
          cache-from: type=gha,scope=edge
      - run: node scripts/upgrade-test.ts nightjar-upgrade:test
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: upgrade-logs
          path: upgrade-logs/
          if-no-files-found: ignore

  dockerhub-description:
    needs: [changes, checks, api, e2e, image]
    if: >-
      !cancelled() && github.event_name == 'push' && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.code == 'true' || needs.changes.outputs.readme == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: porsk/nightjar
          short-description: Self-hosted voice journal. Speak or type, transcribed offline on your own server.
          readme-filepath: ./README.md
