name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg bzip2
      - run: pnpm install --frozen-lockfile
      - name: Download the model and transcribe the fixture clips
        run: pnpm --filter @nightjar/server test:nightly
        env:
          NIGHTJAR_TRANSCRIBER: sherpa

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -f docker/Dockerfile -t nightjar-backup:test .
      - name: Back up and restore with the commands from docs/backup.md
        run: pnpm --filter @nightjar/server test:backup
        env:
          BACKUP_TEST_IMAGE: nightjar-backup:test
